<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARK 5</title>
    <link rel="stylesheet" href="styles.css"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">


</head>
<body>
        <div class="Arc-Reactor">
            <img src="arc.png" class="arc">        
            <img src="ring.png" class="ring">      
            <img src="centre.png" class="centre">        
        </div>
        <div class="ai-assistant">
            <div id="ai-output-container"></div>
            <div class="input-container">
                <span class="icon plus">+</span>
                <div id="ai-input" contenteditable="true" data-placeholder="Type something..."></div>
                <button class="send-btn">  <span class="material-icons">send</span></button>
            </div>
        </div>
        <div class="side-bar" >
            <a href="#"><span class="material-icons">add</span>New Chat</a>
            <a href="#"><span class="material-icons">search</span>Search Chat</a>
            <a href="#"><span class="material-icons">settings</span>Settings</a>
            <div class="side-title">Chats</div>     
        </div>
        <div class="menu-toggle" id="menuToggle">
            <span class="material-icons">menu</span>
        </div>
        <script src="effects.js"></script>
</body>
</html>
